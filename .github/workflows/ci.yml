name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test
        type: string
        required: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: go test -count=1 -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go mod verify
      - name: Test release helpers
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
